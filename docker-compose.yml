services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: dental_crm_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-dental_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dental_pass}
      POSTGRES_DB: ${DB_NAME:-dental_crm}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U ${DB_USER:-dental_user} -d ${DB_NAME:-dental_crm}' ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dental_crm_network

  # Redis Cache (for future use with Bull queue)
  redis:
    image: redis:7-alpine
    container_name: dental_crm_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - dental_crm_network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: dental_crm_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-dental_user}
      DB_PASSWORD: ${DB_PASSWORD:-dental_pass}
      DB_NAME: ${DB_NAME:-dental_crm}
      DATABASE_URL: postgresql://${DB_USER:-dental_user}:${DB_PASSWORD:-dental_pass}@postgres:5432/${DB_NAME:-dental_crm}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-15m}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      REDIS_URL: redis://redis:6379
      # Email Configuration (SMTP/Nodemailer)
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Brilliant Dental Clinic}
      ENABLE_EMAIL_NOTIFICATIONS: ${ENABLE_EMAIL_NOTIFICATIONS:-true}
      # Calendar Configuration (Google Service Account)
      GOOGLE_CLIENT_EMAIL: ${GOOGLE_CLIENT_EMAIL}
      GOOGLE_PRIVATE_KEY: ${GOOGLE_PRIVATE_KEY}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-primary}
      CLINIC_TIMEZONE: ${CLINIC_TIMEZONE:-America/Montevideo}
      TZ: ${CLINIC_TIMEZONE:-America/Montevideo}
      APP_LANGUAGE: ${APP_LANGUAGE:-en}
      GROQ_API_KEY: ${GROQ_API_KEY}
      AI_MODEL: ${AI_MODEL:-llama-3.3-70b-versatile}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-1024}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.7}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    networks:
      - dental_crm_network
    healthcheck:
      test: [ 'CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:3000/api/v1/health' ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Web App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: dental_crm_frontend
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-80}:80'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dental_crm_network
    healthcheck:
      test: [ 'CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost/health' ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Nginx Reverse Proxy (optional - for production with SSL)
  nginx:
    image: nginx:alpine
    container_name: dental_crm_nginx
    restart: unless-stopped
    ports:
      - '${NGINX_PORT:-443}:443'
      - '${NGINX_HTTP_PORT:-8080}:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - dental_crm_network
    profiles:
      - with-nginx

volumes:
  postgres_data:
  redis_data:
  uploads_data:


networks:
  dental_crm_network:
    driver: bridge
